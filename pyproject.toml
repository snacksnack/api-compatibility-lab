[project]
name = "api-compatibility-lab"
version = "0.1.0"
description = "Replay sanitized API traffic across two API versions to find the behavioral breaks a schema diff misses"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
compatlab = "compatlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["compatlab"]

[dependency-groups]
# The shared eval harness (RC1-548), pinned by tag: if the ruler can move
# under a run, a changed score no longer says whether the subject drifted or
# the measurement did. No `llmobs` extra — this subject has no model call to
# trace, and taking the extra would imply otherwise (ADR 0007).
evals = [
    "agent-evals[sql] @ git+https://github.com/snacksnack/agent-evals@v0.6.3",
]
# Only the Pages build needs a markdown renderer. It is a group rather than a
# runtime dependency because nothing in `compatlab` reads markdown: the lab
# writes its reports, and `publish` is the separate step that renders the
# committed ones for the web (ADR 0008).
site = [
    "markdown-it-py>=3",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "ddtrace>=2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
