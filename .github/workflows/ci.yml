name: CI

# push scoped to main so a PR commit runs once (the pull_request event),
# not twice — the ESP repo's RC1-558 lesson, applied from day one.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A follow-up push cancels the superseded run, except on main, where every
# run completes so the Test Optimization history stays whole.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync
        run: uv sync --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      # --ddtrace reports test-level results to Test Optimization, agentless.
      # Not a test credential: the suite passes identically with no key, and
      # the spike's Stripe calls never run in CI (no STRIPE_SECRET_KEY here).
      - name: Tests
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_CIVISIBILITY_AGENTLESS_ENABLED: "true"
          DD_SITE: datadoghq.com
          DD_SERVICE: api-compatibility-lab
          DD_ENV: ci
        run: uv run pytest --ddtrace --cov

      # The epic's scored requirement as a gate, not a footnote: an
      # independent scan of the committed corpus must find zero PII or
      # secrets. The test suite asserts the same thing per file; this step
      # exists so the failure is legible as its own red X.
      - name: Corpus PII scan
        run: uv run python -m compatlab scan corpus/

      # The Phase 3 honesty gate: scoring exits non-zero while any finding
      # classified `breaking` has no hand verdict in scoring/adjudication.json,
      # so a new finding cannot reach the published false-break rate
      # unexamined. Offline — it reads the committed baseline index, and never
      # runs oasdiff or touches Stripe.
      - name: Score the differ against ground truth
        run: uv run python -m compatlab score

      # The Phase 4 gate, same shape. It fails on an integration inventory
      # that no longer matches the captured traffic (a stale declared read is
      # the normal way this input goes wrong), and it refuses to publish a
      # workflow-mapping precision while any impact claim is unconfirmed
      # against the replay record. Also offline.
      - name: Map findings onto customer workflows
        run: uv run python -m compatlab impact
